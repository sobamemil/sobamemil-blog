<!DOCTYPE html>
<html>
<head>
<style>
  body {
    width: 1200px;
    height: 630px;
    margin: 0;
    background: linear-gradient(135deg, #18191a 0%, #242526 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    box-sizing: border-box;
    padding: 60px;
    border: 12px solid #ea4aaa;
  }
  .icon { font-size: 100px; margin-bottom: 20px; }
  .title { font-size: 64px; font-weight: 900; background: linear-gradient(135deg, #ea4aaa, #3182f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
  .subtitle { font-size: 32px; color: #a0a0a0; font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <div class="icon">🍜</div>
  <div class="title">Sobamemil Tech Blog</div>
  <div class="subtitle">🏠 스마트홈 & DIY | 💻 개발 & CS | 📱 리뷰 & 일상</div>
</body>
</html>
