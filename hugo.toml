baseURL = 'https://blog.sobamemil.com/'
locale = 'ko-KR'
title = 'Sobamemil Tech Blog'
theme = 'PaperMod'

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = 'production'
  title = 'Sobamemil Tech Blog'
  description = '스마트홈 & DIY, 개발 & CS, 테크 리뷰 및 일상 가이드 블로그'
  keywords = ['Home Assistant', 'IoT', 'TypeScript', 'Rust', 'Swift', 'Tech Blog', 'Sobamemil']
  author = 'Sobamemil'

  defaultTheme = 'auto'
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # Enable standard blog post list home layout with pagination & search
  [params.profileMode]
    enabled = false

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "smarthome"
    name = "🏠 스마트홈 & DIY"
    url = "/categories/-스마트홈--diy/"
    weight = 10

  [[menu.main]]
    identifier = "dev"
    name = "💻 개발 & CS"
    url = "/categories/-개발--cs/"
    weight = 20

  [[menu.main]]
    identifier = "review"
    name = "📱 리뷰 & 일상"
    url = "/categories/-리뷰--일상/"
    weight = 30

  [[menu.main]]
    identifier = "categories"
    name = "📂 전체 카테고리"
    url = "/categories/"
    weight = 40

  [[menu.main]]
    identifier = "search"
    name = "🔍 검색"
    url = "/search/"
    weight = 50

  [[menu.main]]
    identifier = "tags"
    name = "🏷️ 태그"
    url = "/tags/"
    weight = 60

[outputs]
  home = ["HTML", "RSS", "JSON"]
