baseURL = 'https://blog.sobamemil.com/'
theme = 'PaperMod'

defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = 'production'
  author = 'Sobamemil'
  defaultTheme = 'auto'
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # Disable Profile Mode so homepage shows clean post cards immediately!
  [params.profileMode]
    enabled = false

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[languages]
  [languages.ko]
    locale = 'ko-KR'
    label = 'EN'
    weight = 1
    title = 'Sobamemil'
    description = '스마트홈 & DIY, 개발 & CS, 테크 리뷰 및 일상 가이드 블로그'

    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "smarthome"
        name = "스마트홈 & DIY"
        url = "/categories/-스마트홈--diy/"
        weight = 10

      [[languages.ko.menu.main]]
        identifier = "dev"
        name = "개발 & CS"
        url = "/categories/-개발--cs/"
        weight = 20

      [[languages.ko.menu.main]]
        identifier = "review"
        name = "리뷰 & 일상"
        url = "/categories/-리뷰--일상/"
        weight = 30

      [[languages.ko.menu.main]]
        identifier = "search"
        name = "검색"
        url = "/search/"
        weight = 40

  [languages.en]
    locale = 'en-US'
    label = 'KO'
    weight = 2
    title = 'Sobamemil'
    description = 'Smart Home & DIY, Software Development, Tech Reviews & Life Guides'

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/en/search/"
        weight = 10

      [[languages.en.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/en/tags/"
        weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
