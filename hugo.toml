baseURL = 'https://blog.sobamemil.com/'
theme = 'PaperMod'

defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      typographer = false

[params]
  env = 'production'
  author = 'Sobamemil'
  defaultTheme = 'auto'
  disableThemeToggle = false
  mainSections = ["posts"]

  ShowReadingTime = true

  # Disabled post share buttons (x / y / facebook) as requested
  ShowShareButtons = false

  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # Enable Giscus Comments on posts
  comments = true

  # Open Graph & Twitter Sharing Card Image
  images = ["/images/og-image.png"]

  # Favicon configuration (Soba Noodle 🍜 icon)
  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[languages]
  [languages.ko]
    locale = 'ko-KR'
    label = 'EN'
    weight = 1
    title = 'Sobamemil'
    description = '스마트홈 & DIY, 개발 & CS, 테크 리뷰 및 일상 가이드 블로그'

    [languages.ko.params.profileMode]
      enabled = true
      title = "안녕하세요, Sobamemil입니다 👋"
      subtitle = "스마트홈 DIY, 개발 & CS 지식, 그리고 잡다한 기술을 탐구하고 기록하는 개인 블로그입니다."
      imageUrl = "/apple-touch-icon.png"
      imageWidth = 120
      imageHeight = 120
      imageTitle = "Sobamemil"

      [[languages.ko.params.profileMode.buttons]]
        name = "📝 모든 글 보기"
        url = "/posts/"

      [[languages.ko.params.profileMode.buttons]]
        name = "🗂️ 카테고리"
        url = "/categories/"

    [[languages.ko.params.socialIcons]]
      name = "github"
      url = "https://github.com/sobamemil"

    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "home"
        name = "홈"
        url = "/"
        weight = 5

      [[languages.ko.menu.main]]
        identifier = "smarthome"
        name = "스마트홈 & DIY"
        url = "/categories/-스마트홈--diy/"
        weight = 10

      [[languages.ko.menu.main]]
        identifier = "dev"
        name = "개발 & CS"
        url = "/categories/-개발--cs/"
        weight = 20

      [[languages.ko.menu.main]]
        identifier = "review"
        name = "리뷰 & 일상"
        url = "/categories/-리뷰--일상/"
        weight = 30

      [[languages.ko.menu.main]]
        identifier = "categories"
        name = "카테고리"
        url = "/categories/"
        weight = 40

      [[languages.ko.menu.main]]
        identifier = "search"
        name = "검색"
        url = "/search/"
        weight = 50

  [languages.en]
    locale = 'en-US'
    label = 'KO'
    weight = 2
    title = 'Sobamemil'
    description = 'Smart Home & DIY, Software Development, Tech Reviews & Life Guides'

    [languages.en.params.profileMode]
      enabled = true
      title = "Hi, I'm Sobamemil 👋"
      subtitle = "A personal tech blog exploring Smart Home DIY, Software Development, and various CS knowledge."
      imageUrl = "/apple-touch-icon.png"
      imageWidth = 120
      imageHeight = 120
      imageTitle = "Sobamemil"

      [[languages.en.params.profileMode.buttons]]
        name = "📝 Read Posts"
        url = "/en/posts/"

      [[languages.en.params.profileMode.buttons]]
        name = "🗂️ Categories"
        url = "/en/categories/"

    [[languages.en.params.socialIcons]]
      name = "github"
      url = "https://github.com/sobamemil"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "home"
        name = "Home"
        url = "/en/"
        weight = 5

      [[languages.en.menu.main]]
        identifier = "smarthome"
        name = "Smart Home & DIY"
        url = "/en/categories/-smart-home--diy/"
        weight = 10

      [[languages.en.menu.main]]
        identifier = "dev"
        name = "Dev & CS"
        url = "/en/categories/-dev--cs/"
        weight = 20

      [[languages.en.menu.main]]
        identifier = "review"
        name = "Reviews & Life"
        url = "/en/categories/-reviews--life/"
        weight = 30

      [[languages.en.menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/en/categories/"
        weight = 40

      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/en/search/"
        weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]
