baseURL = 'https://blog.sobamemil.com/'
locale = 'ko-KR'
title = 'Sobamemil Tech Blog'
theme = 'PaperMod'

enableRobotsTXT = true
paginate = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = 'production'
  title = 'Sobamemil Tech Blog'
  description = '스마트홈 & DIY, 개발 & CS, 시스템 및 하드웨어 기술 블로그'
  keywords = ['Home Assistant', 'IoT', 'C++', 'Network', 'iOS', 'Tech Blog', 'Sobamemil']
  author = 'Sobamemil'

  defaultTheme = 'auto'
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true

  [params.profileMode]
    enabled = true
    title = "Sobamemil Tech Blog"
    subtitle = "🏠 스마트홈 & DIY | 💻 개발 & CS | 📱 리뷰 & 일상"
    imageUrl = ""
    imageTitle = "Sobamemil"
    imageWidth = 120
    imageHeight = 120
    buttons = [
        { name = "포스팅 목록", url = "posts" },
        { name = "GitHub", url = "https://github.com/sobamemil" }
    ]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "포스팅"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "search"
    name = "검색"
    url = "/search/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
