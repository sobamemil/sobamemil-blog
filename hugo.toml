baseURL = 'https://blog.sobamemil.com/'
locale = 'ko-KR'
title = 'Sobamemil Tech Blog'
theme = 'PaperMod'

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = 'production'
  title = 'Sobamemil Tech Blog'
  description = '스마트홈 & DIY, 개발 & CS, 테크 리뷰 및 일상 가이드 블로그'
  keywords = ['Home Assistant', 'IoT', 'TypeScript', 'Rust', 'Swift', 'Tech Blog', 'Sobamemil']
  author = 'Sobamemil'

  defaultTheme = 'auto'
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # Re-enable sleek Profile Mode home landing card
  [params.profileMode]
    enabled = true
    title = "Sobamemil Tech Blog"
    subtitle = "🏠 스마트홈 & DIY | 💻 개발 & CS | 📱 리뷰 & 일상"
    buttons = [
        { name = "📜 전체 포스팅 보기", url = "/posts/" },
        { name = "💖 GitHub Sponsors", url = "https://github.com/sponsors/sobamemil" }
    ]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "home"
    name = "🏠 홈"
    url = "/"
    weight = 5

  [[menu.main]]
    identifier = "posts"
    name = "📜 전체 포스팅"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "smarthome"
    name = "🏠 스마트홈 & DIY"
    url = "/categories/-스마트홈--diy/"
    weight = 20

  [[menu.main]]
    identifier = "dev"
    name = "💻 개발 & CS"
    url = "/categories/-개발--cs/"
    weight = 30

  [[menu.main]]
    identifier = "review"
    name = "📱 리뷰 & 일상"
    url = "/categories/-리뷰--일상/"
    weight = 40

  [[menu.main]]
    identifier = "search"
    name = "🔍 검색"
    url = "/search/"
    weight = 50

  [[menu.main]]
    identifier = "tags"
    name = "🏷️ 태그"
    url = "/tags/"
    weight = 60

[outputs]
  home = ["HTML", "RSS", "JSON"]
